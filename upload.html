<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpeta Digital | Gasal</title>
    <link rel="icon" href="favicon.jpg?v=3">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=final_clean">
    <script src="config.js"></script>
</head>
<body>

    <div class="container-glass text-left">
        <div style="text-align: center;">
            <img src="logo.jpg" style="max-height: 55px; margin-bottom: 15px;">
            <h2>Carpeta Digital</h2>
        </div>
        
        <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>

        <form id="wizardForm" novalidate>
            
            <div id="step1" class="step-content active">
                <h3>1. Perfil del Solicitante</h3>
                
                <div class="radio-group-horizontal">
                    <label class="radio-card selected" onclick="selectCard(this)">
                        <input type="radio" name="perfil" value="dependiente" checked onchange="updateReq()">
                        <span class="radio-title">Dependiente</span>
                        <span class="radio-desc">Con Contrato</span>
                    </label>
                    <label class="radio-card" onclick="selectCard(this)">
                        <input type="radio" name="perfil" value="independiente" onchange="updateReq()">
                        <span class="radio-title">Independiente</span>
                        <span class="radio-desc">Boletas</span>
                    </label>
                    <label class="radio-card" onclick="selectCard(this)">
                        <input type="radio" name="perfil" value="socio" onchange="updateReq()">
                        <span class="radio-title">Empresario</span>
                        <span class="radio-desc">Dueño / Socio</span>
                    </label>
                </div>

                <div class="mt-8">
                    <h3 style="border:none; margin-bottom:15px; font-size:1rem; color:#444;">¿Complementas Renta?</h3>
                    <div class="radio-group-horizontal grid-2"> <label class="radio-card selected" onclick="selectCodeudorCard(this, false)">
                            <input type="radio" name="codeudor_check" value="no" checked>
                            <span class="radio-title">No</span>
                            <span class="radio-desc">Voy solo</span>
                        </label>
                        <label class="radio-card" onclick="selectCodeudorCard(this, true)">
                            <input type="radio" name="codeudor_check" value="si">
                            <span class="radio-title">Sí</span>
                            <span class="radio-desc">Con Codeudor</span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="step2" class="step-content">
                <h3>2. Datos del Titular</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group"><label>Nombre Completo</label><input type="text" name="titular_nombre" required></div>
                    <div class="form-group"><label>RUT</label><input type="text" name="rut" id="rutInput" placeholder="12345678-9" required oninput="checkRut(this)"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                    <div class="form-group"><label>Teléfono</label><input type="tel" name="telefono" placeholder="+569..." required></div>
                    
                    <div class="form-group"><label>Región</label><select id="reg_titular" required onchange="loadComunas('reg_titular','com_titular')"></select></div>
                    <div class="form-group"><label>Comuna</label><select id="com_titular" name="comuna" required disabled><option value="">Selecciona...</option></select></div>
                    
                    <div class="form-group md:col-span-2"><label>Dirección</label><input type="text" name="direccion_calle" required></div>
                </div>
            </div>

            <div id="step3" class="step-content">
                <h3>3. Datos del Codeudor</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group"><label>Nombre</label><input type="text" name="codeudor_nombre" class="input-cod"></div>
                    <div class="form-group"><label>RUT</label><input type="text" name="codeudor_rut" class="input-cod" oninput="checkRut(this)"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="codeudor_email" class="input-cod"></div>
                    <div class="form-group"><label>Teléfono</label><input type="tel" name="codeudor_telefono" class="input-cod"></div>
                </div>
            </div>

            <div id="step4" class="step-content">
                <h3>4. Declaración Financiera</h3>
                <div class="grid grid-cols-2 gap-6 mb-6">
                    <div><label>Sueldo Fijo</label><input type="number" name="ingreso_fijo" placeholder="$"></div>
                    <div><label>Variable</label><input type="number" name="ingreso_variable" placeholder="$"></div>
                    <div><label>Honorarios</label><input type="number" name="ingreso_honorarios" placeholder="$"></div>
                    <div><label>Retiros</label><input type="number" name="ingreso_retiros" placeholder="$"></div>
                </div>
                <h4 class="font-bold text-red-600 text-sm mt-6 border-b pb-2 mb-4">DEUDAS VIGENTES (CUOTA MENSUAL)</h4>
                <div class="space-y-4">
                    <div class="flex gap-4"><select name="banco_hipotecario" class="w-1/2 text-xs bank-sel"><option value="">Hipotecario</option></select><input type="number" name="pasivo_hipotecario" placeholder="$" class="w-1/2"></div>
                    <div class="flex gap-4"><select name="banco_consumo" class="w-1/2 text-xs bank-sel"><option value="">Consumo</option></select><input type="number" name="pasivo_consumo" placeholder="$" class="w-1/2"></div>
                </div>
            </div>

            <div id="step5" class="step-content">
                <h3>5. Carga de Documentos</h3>
                <div class="checklist-container">
                    <h4 class="font-bold text-sm mb-4">Documentación Requerida:</h4>
                    <div id="checklist-display"></div>
                    <div class="mt-4 pt-4 border-t" style="display: flex; align-items: center;">
                        <span class="check-icon">➝</span> 
                        <span style="font-size: 0.9rem;">CMF: <a href="https://www.cmfchile.cl" target="_blank" class="tutorial-link">Descargar Informe de Deudas</a></span>
                    </div>
                </div>
                <div class="p-6 bg-blue-50 border border-blue-200 rounded text-center">
                    <input type="file" id="fileInput" multiple onchange="updateFileList()" class="hidden">
                    <button type="button" onclick="document.getElementById('fileInput').click()" class="btn-main" style="background:#2563eb;font-size:0.9rem;">SELECCIONAR ARCHIVOS</button>
                    <div id="fileListDisplay" class="mt-3 text-sm text-gray-600"></div>
                </div>
            </div>

            <div class="btn-row">
                <button type="button" id="btnPrev" class="btn-secondary hidden" onclick="move(-1)">Atrás</button>
                <button type="button" id="btnNext" class="btn-main" onclick="move(1)">Siguiente</button>
                <button type="submit" id="btnSubmit" class="btn-main hidden bg-green-600">ENVIAR</button>
            </div>
            <p id="errorMsg" class="text-center text-xs text-red-600 font-bold mt-2 h-4"></p>
        </form>
    </div>

    <script>
        // --- DATA ---
        const banks = ["Sin Deuda","Banco de Chile","Santander","Banco Estado","Scotiabank","Bci","Itaú","Security","Falabella","Consorcio","Coopeuch"];
        const geo = {
            "Metropolitana":["Santiago","Cerrillos","Cerro Navia","Conchalí","El Bosque","Estación Central","Huechuraba","Independencia","La Cisterna","La Florida","La Granja","La Pintana","La Reina","Las Condes","Lo Barnechea","Lo Espejo","Lo Prado","Macul","Maipú","Ñuñoa","Pedro Aguirre Cerda","Peñalolén","Providencia","Pudahuel","Quilicura","Quinta Normal","Recoleta","Renca","San Joaquín","San Miguel","San Ramón","Vitacura","Puente Alto","San Bernardo"],
            "Valparaíso":["Valparaíso","Viña del Mar","Concón","Quilpué","Villa Alemana"], "Biobío":["Concepción","Talcahuano","San Pedro","Los Ángeles"], "Antofagasta":["Antofagasta","Calama"], "Coquimbo":["La Serena","Coquimbo"], "Araucanía":["Temuco","Villarrica","Pucón"], "Los Lagos":["Puerto Montt","Puerto Varas","Osorno"], "Otras":["Otra Comuna"]
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.bank-sel').forEach(s => banks.forEach(b => s.add(new Option(b, b))));
            const r = document.getElementById('reg_titular'); for(let k in geo) r.add(new Option(k, k));
            updateReq();
        });

        // --- UI LOGIC ---
        function loadComunas(idReg, idCom) {
            const regVal = document.getElementById(idReg).value;
            const comSelect = document.getElementById(idCom);
            comSelect.innerHTML = '<option value="">Selecciona...</option>';
            if(regVal && geo[regVal]) {
                comSelect.disabled = false;
                geo[regVal].sort().forEach(c => comSelect.add(new Option(c, c)));
            } else { comSelect.disabled = true; }
        }

        // Validación RUT Tolerante (18.xxx y 18xxx)
        const Fn = {
            validaRut: function (rutCompleto) {
                let cleanRut = rutCompleto.replace(/[^0-9kK]/g, "");
                if (cleanRut.length < 2) return false;
                let cuerpo = cleanRut.slice(0, -1);
                let dv = cleanRut.slice(-1).toUpperCase();
                if (!/^[0-9]+$/.test(cuerpo)) return false;
                let T = parseInt(cuerpo); let M = 0, S = 1;
                for (; T; T = Math.floor(T / 10)) S = (S + T % 10 * (9 - M++ % 6)) % 11;
                let dvCalc = S ? S - 1 : 'K';
                return dvCalc.toString() === dv;
            }
        }
        function checkRut(input) {
            if (Fn.validaRut(input.value)) { input.classList.remove('invalid'); input.classList.add('valid'); } 
            else { input.classList.remove('valid'); input.classList.add('invalid'); }
        }

        // --- NAVEGACION ---
        let step = 1; let hasCodeudor = false;
        
        // Selección de Perfil (Arriba)
        function selectCard(l){ 
            l.parentElement.querySelectorAll('.radio-card').forEach(c=>c.classList.remove('selected')); 
            l.classList.add('selected'); 
            l.querySelector('input').checked = true;
            updateReq(); 
        }

        // Selección de Codeudor (Abajo)
        function selectCodeudorCard(l, val){
            l.parentElement.querySelectorAll('.radio-card').forEach(c=>c.classList.remove('selected')); 
            l.classList.add('selected'); 
            l.querySelector('input').checked = true;
            hasCodeudor = val; 
            updateReq(); 
        }

        function move(n) {
            document.getElementById('errorMsg').innerText = "";
            if (n === 1 && !validarPaso()) { document.getElementById('errorMsg').innerText = "⚠️ Revisa los campos en rojo."; return; }
            
            let next = step + n;
            if (next === 3 && !hasCodeudor) next = (n > 0) ? 4 : 2;

            document.getElementById(`step${step}`).classList.remove('active');
            step = next;
            document.getElementById(`step${step}`).classList.add('active');

            document.getElementById('btnPrev').classList.toggle('hidden', step === 1);
            document.getElementById('btnNext').classList.toggle('hidden', step === 5);
            document.getElementById('btnSubmit').classList.toggle('hidden', step !== 5);
            document.getElementById('progressBar').style.width = `${((step-1)/4)*100}%`;
        }

        function validarPaso() {
            let ok = true;
            const inputs = document.getElementById(`step${step}`).querySelectorAll('input[required], select[required]');
            inputs.forEach(i => {
                if (step === 3 && !hasCodeudor) return;
                if (!i.value.trim() || i.classList.contains('invalid')) { i.classList.add('invalid'); ok = false; }
                else { i.classList.remove('invalid'); }
            });
            return ok;
        }

        function updateReq() {
            const p = document.querySelector('input[name="perfil"]:checked').value;
            const list = document.getElementById('checklist-display'); list.innerHTML = '';
            const docs = { dependiente:["Cédula","3 Liquidaciones","AFP 12m"], independiente:["Cédula","Boletas 6m","Carpeta Trib."], socio:["Cédula","Carpeta Trib.","Balances"] };
            
            // Render sin emojis
            docs[p].forEach(d => list.innerHTML += `<div class="checklist-item"><span class="check-icon">✓</span> ${d}</div>`);
            if(hasCodeudor) list.innerHTML += `<div class="mt-4 font-bold text-sm text-teal-600 mb-2">CODEUDOR:</div>` + docs['dependiente'].map(d=>`<div class="checklist-item"><span class="check-icon">✓</span> ${d}</div>`).join('');
        }

        function updateFileList() {
            const f = document.getElementById('fileInput').files;
            document.getElementById('fileListDisplay').innerText = f.length ? `${f.length} archivos seleccionados` : '';
        }

        document.getElementById('wizardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(document.getElementById('fileInput').files.length === 0) { alert("Sube archivos"); return; }
            const btn = document.getElementById('btnSubmit'); btn.innerText="ENVIANDO..."; btn.disabled=true;
            
            const fd = new FormData(e.target); const data = Object.fromEntries(fd.entries());
            const files = []; const inputs = document.getElementById('fileInput').files;
            for(let f of inputs) files.push({ fileName: f.name, mimeType: f.type, data: (await toBase64(f)).split(',')[1] });

            try { await fetch(CONFIG.API_URL, { method:'POST', body:JSON.stringify({action:"subir_carpeta", formData:data, files:files}) }); window.location.href="gracias.html"; }
            catch(e) { alert("Error"); btn.disabled=false; }
        });
        const toBase64=f=>new Promise((r,j)=>{const t=new FileReader;t.readAsDataURL(f),t.onload=()=>r(t.result),t.onerror=j});
    </script>
</body>
</html>
