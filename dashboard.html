<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola Broker OS | Gasal</title>
    <link rel="icon" href="favicon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=final">
    <script src="config.js"></script>

    <style>
        body { overflow: hidden; }
        .top-bar {
            background: rgba(43, 46, 52, 0.95);
            backdrop-filter: blur(10px);
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .board-wrapper {
            height: calc(100vh - 60px);
            padding: 20px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .column {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            min-width: 300px; width: 300px;
            border-radius: 12px;
            display: flex; flex-direction: column;
            max-height: 90%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .column-header {
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: var(--brand-dark);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .column-body {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 100px;
        }
        .lead-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: grab;
            transition: all 0.2s;
            border-left: 4px solid var(--brand-accent);
            white-space: normal;
        }
        .lead-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .lead-card:active { cursor: grabbing; }
        .status-new { border-left-color: #3b82f6; }
        .status-chat { border-left-color: #f59e0b; }
        .status-docs { border-left-color: #ef4444; }
        .status-eval { border-left-color: #8b5cf6; }
        .status-won { border-left-color: #10b981; }
        .btn-refresh {
            background: var(--brand-accent); color: white;
            border: none; width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-refresh:hover { background: var(--brand-accent-hover); transform: rotate(180deg); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" alt="Logo" style="height: 35px; border-radius: 4px; background: white; padding: 2px;">
            <span style="color: white; font-family: 'Montserrat'; font-weight: 700;">BROKER OS</span>
        </div>
        <button onclick="cargarLeads()" class="btn-refresh" title="Actualizar">↻</button>
    </div>

    <div class="board-wrapper">
        <div class="column">
            <div class="column-header"><span>🆕 Nuevos</span><span id="c-new" class="text-xs bg-gray-200 px-2 py-1 rounded-full">0</span></div>
            <div class="column-body" id="col-Nuevo Lead" ondrop="drop(event, 'Nuevo Lead')" ondragover="allowDrop(event)"></div>
        </div>
        <div class="column">
            <div class="column-header"><span>💬 Conversando</span><span id="c-chat" class="text-xs bg-gray-200 px-2 py-1 rounded-full">0</span></div>
            <div class="column-body" id="col-En Conversación" ondrop="drop(event, 'En Conversación')" ondragover="allowDrop(event)"></div>
        </div>
        <div class="column" style="background: rgba(254, 242, 242, 0.9);">
            <div class="column-header" style="color: #9f1239;"><span>📂 Solicitar Docs</span><span id="c-docs" class="text-xs bg-red-100 px-2 py-1 rounded-full">0</span></div>
            <div class="column-body" id="col-Solicitar Documentos" ondrop="drop(event, 'Solicitar Documentos')" ondragover="allowDrop(event)"></div>
        </div>
        <div class="column">
            <div class="column-header"><span>📊 En Evaluación</span><span id="c-eval" class="text-xs bg-gray-200 px-2 py-1 rounded-full">0</span></div>
            <div class="column-body" id="col-En Evaluación" ondrop="drop(event, 'En Evaluación')" ondragover="allowDrop(event)"></div>
        </div>
        <div class="column">
            <div class="column-header"><span>✅ Aprobados</span><span id="c-won" class="text-xs bg-gray-200 px-2 py-1 rounded-full">0</span></div>
            <div class="column-body" id="col-Aprobado" ondrop="drop(event, 'Aprobado')" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex flex-col items-center justify-center hidden backdrop-blur-sm">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-teal-500 border-t-transparent mb-3"></div>
        <p class="text-white font-bold">Sincronizando...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', cargarLeads);
        async function cargarLeads() {
            mostrarLoad(true); limpiar();
            try {
                const res = await fetch(CONFIG.API_URL + "?action=getLeads");
                const leads = await res.json();
                leads.forEach(l => renderCard(l)); contar();
            } catch (e) { console.error(e); alert("Error de conexión."); }
            mostrarLoad(false);
        }
        function renderCard(lead) {
            let st = lead.Estado || "Nuevo Lead";
            let col = document.getElementById("col-" + st) || document.getElementById("col-Nuevo Lead");
            const card = document.createElement('div'); card.className = "lead-card"; card.draggable = true; card.id = lead.id; card.ondragstart = drag;
            if(st.includes("Nuevo")) card.classList.add("status-new");
            else if(st.includes("Conversación")) card.classList.add("status-chat");
            else if(st.includes("Solicitar")) card.classList.add("status-docs");
            else if(st.includes("Evaluación")) card.classList.add("status-eval");
            else if(st.includes("Aprobado")) card.classList.add("status-won");
            card.innerHTML = `<div class="font-bold text-gray-800 text-sm">${lead.Nombre}</div><div class="text-xs text-gray-500 mt-1 truncate">📧 ${lead.Email}</div><div class="text-xs text-gray-500 truncate">📞 ${lead.Telefono}</div>`;
            col.appendChild(card);
        }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function allowDrop(ev) { ev.preventDefault(); }
        async function drop(ev, nuevoEstado) {
            ev.preventDefault(); const id = ev.dataTransfer.getData("text"); const card = document.getElementById(id);
            document.getElementById("col-" + nuevoEstado).appendChild(card); contar();
            mostrarLoad(true);
            try {
                await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: "updateState", rowId: id, newState: nuevoEstado }), headers: { 'Content-Type': 'text/plain' } });
                if(nuevoEstado.includes("Solicitar")) alert("✅ Correo de solicitud enviado.");
            } catch (e) { alert("Error al guardar."); cargarLeads(); }
            mostrarLoad(false);
        }
        function limpiar() { document.querySelectorAll('.column-body').forEach(c => c.innerHTML = ''); }
        function mostrarLoad(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
        function contar() {
            document.getElementById('c-new').innerText = document.getElementById('col-Nuevo Lead').childElementCount;
            document.getElementById('c-chat').innerText = document.getElementById('col-En Conversación').childElementCount;
            document.getElementById('c-docs').innerText = document.getElementById('col-Solicitar Documentos').childElementCount;
            document.getElementById('c-eval').innerText = document.getElementById('col-En Evaluación').childElementCount;
            document.getElementById('c-won').innerText = document.getElementById('col-Aprobado').childElementCount;
        }
    </script>
</body>
</html>
